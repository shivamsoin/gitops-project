name: python app package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build App container
        run: docker build -t ${{ vars.DOCKER_USERNAME }}/log-generator .
      - name: list image
        run: docker image ls 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push image to dockerhub
        run: docker push ${{ vars.DOCKER_USERNAME }}/log-generator:latest