name: python app package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Calculate Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build App container
        run: docker build -t ${{ vars.DOCKER_USERNAME }}/log-generator:${GITHUB_SHA:0:7} .
      - name: list image
        run: docker image ls 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push image to dockerhub
        run: docker push ${{ vars.DOCKER_USERNAME }}/log-generator:${{ steps.vars.outputs.sha_short }}

      - name: 'Setup yq'
        uses: dcarbone/install-yq-action@v1
        with:
          version: '${{ inputs.version }}'
          download-compressed: '${{ inputs.download-compressed }}'
          force: '${{ inputs.force }}'
      - name: Update Image 
        run: |
          yq -i '.spec.template.spec.containers[0].image = "shivamsoin0408/log-generator:${{ steps.vars.outputs.sha_short }}"' ./helm/logger/deployment.yaml
          cat ./helm/logger/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/logger/deployment.yaml
          git commit -m "chore: bump image to ${{ steps.vars.outputs.sha_short }}" || echo "no changes"
          git push