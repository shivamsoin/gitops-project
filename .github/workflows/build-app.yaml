name: python app package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Calculate Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build App container
        run: docker build -t ${{ vars.DOCKER_USERNAME }}/log-generator:${GITHUB_SHA:0:7} .
      - name: list image
        run: docker image ls 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push image to dockerhub
        run: docker push ${{ vars.DOCKER_USERNAME }}/log-generator:${{ steps.vars.outputs.sha_short }}
      - name: Update image tag
        run: |
          sed -i "s|shivamsoin0408/log-generator:.*|shivamsoin0408/log-generator:${{ steps.vars.outputs.sha_short }}|" helm/logger/deployment.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/logger/values.yaml
          git commit -m "chore: bump image to ${{ steps.vars.outputs.sha_short }}" || echo "no changes"
          git push